# Parisonz MyFaces Hibernate Spring Integration Application
# JDBC Related Settings
#
# Connection settings are resolved at runtime by Spring's PropertyPlaceholderConfigurer
# (searchSystemEnvironment=true, applicationContext-hibernate.xml). The ${VAR:default}
# form means: use environment variable VAR if it is set, otherwise the default after ':'.
#   PROD -> set JDBC_URL / JDBC_USER / JDBC_PASSWORD in the container environment.
#   dev  -> no env vars needed; the defaults below target the local MySQL on port 3308.
# serverTimezone lives inside JDBC_URL, so UTC/cloud environments override it via the env
# var without a code change. No real credentials are stored in this file.
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=${JDBC_URL:jdbc:mysql://localhost:3308/db_sis_academica?useSSL=false&serverTimezone=UTC&noAccessToProcedureBodies=true}
jdbc.username=${JDBC_USER:pdiaz}
jdbc.password=${JDBC_PASSWORD:Uo5ath2x}
# Property that determines the Hibernate dialect
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.jdbc.batch_size=30
hibernate.show_sql=false
